name: Build and Deploy Code

# on: [push, pull_request] --> our runner(vm) will trigger on every push or PR on any branch of the repo
on: 
  push: # this is another way of writing lists
    branches:
      - "main"
      # - "ot1her_branch"
  # pull_request:
  #   branches:
  #     - "main"
  #     - "test_branch"

#NOTE: if u wanna make this env access to all jobs of this current workflow then declare here
# environment: 
#       name: testing #this should be the exact environment name u created in repo's settings > environment
#     env: 
#      .......

jobs: # list of jobs that will run on our runner

  build: # Continuous Integration(CI)
    #NOTE: these environments are scoped only to this particualr job ie. job1 rn
    environment: 
      name: testing #this should be the exact environment name u created in repo's settings > environment

    env: 
      DATABASE_HOSTNAME: ${{vars.DATABASE_HOSTNAME}}
      DATABASE_PORT: ${{vars.DATABASE_PORT}}
      DATABASE_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
      DATABASE_NAME: ${{vars.DATABASE_NAME}}
      DATABASE_USERNAME: ${{vars.DATABASE_USERNAME}}

      SECRET_KEY: ${{secrets.SECRET_KEY}}
      ALGORITHM: ${{vars.ALGORITHM}}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${{vars.ACCESS_TOKEN_EXPIRE_MINUTES}}

    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_PASSWORD: ${{secrets.DATABASE_PASSWORD}}
          POSTGRES_DB: ${{vars.DATABASE_NAME}}_test #since we used dbname as fastapi_test in conftest.py
          POSTGRES_USER: ${{vars.DATABASE_USERNAME}}
        ports:
          - "${{vars.DATABASE_PORT}}:5432" #ports expect list so raw ${{}} wont work, so put it as string
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    runs-on: ubuntu-latest #the vm we wanna run our job

    steps:
      - name: Pulling git repo # pull github repo to runner
        uses: actions/checkout@v7 #this is an action grabbed from github marketplace

      - name: Install python-3.14.7 #install python to runner
        uses: actions/setup-python@v7
        with:
          python-version: '3.14.7'
          cache: 'pip' # caching pip dependencies

      - name: Update pip
        run: python -m pip install --upgrade pip

      - name: Install all dependencies
        run: pip install -r requirements.txt
      
      - name: Install pytest and do testing
        run: pytest
        # commenting following cmd cuz i ve already added pytest in requirements.txt
        # run: | #its YAML syntax, not a shell pipe, it runs following commands one by one, each line represents a command
        #   pip install pytest
        #   pytest
      
      #setup docker hub connection, 
      # steps below must run after our pytest cuz if pytest fails then the job1 stops, and we dont ve to worry about pushing the half baked image to docker
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }} #this is a PAT personal access token

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        # id: buildx --> use this only if u wanna pass id to the 'Build and push Docker image' step 

      - name: Build and push Docker image
        id: docker_build #id is needed for Image Digest step to run
        uses: docker/build-push-action@v7
        with:
          #NOTE: if context isnt set, docker buildx will directly fetch from github rep and any file mutation in the above steps
          #  that precede the build step will be ignored, including .dockerignore file. 
          context: ./ #setting ctx as our workspace path

          # build-push-action only builds the image and keeps it in the runner but doesnt push to Docker Hub. so push is necessary
          push: ${{ github.event_name != 'pull_request' }} #evaluates to 'true' if event triggered is push or anyother event except pull_request.
          #its a saftey guardrail cuz PRs from forks should not get my Docker access token 

          # adding sha tag as well cuz 'latest' tag moves with every new push
          tags: |
            ${{ vars.DOCKER_USERNAME }}/my_fast_api:latest
            ${{ vars.DOCKER_USERNAME }}/my_fast_api:${{ github.sha }}

          #/tmp/.buildx-cache would also need an extra actions/cache step to persist across runs, which is why people moved to type=gha
          # cache-from: type=local,src=/tmp/.buildx-cache
          # cache-to: type=local,dest=/tmp/.buildx-cache
          cache-from: type=gha
          cache-to: type=gha,mode=max 

          # file: ./Dockerfile this is redundant cuz ${{context}}/Dockerfile is default, and our Dockerfile is in project root dir

          # builder: ${{ steps.buildx.outputs.name }} this is redundant as well cuz setup-buildx-action already sets the builder it creates 
          # as the current default, so due to this we dont ve to define 'id: buildx' in 'Set up Docker Buildx'
      
      # a digest is the image’s content hash (sha256:...). Unlike a tag, which can be moved to point at a different image, 
      # a digest identifies one exact image forever. If push is false, no digest is produced for a registry image, so the output may be empty.
      - name: Image digest
        run: echo ${{ steps.docker_build.outputs.digest }} #this requires the id we ve given to "Build and push Docker image" step
      


# Continuous Deployment(CD) for render
  deploy_on_render: 

    runs-on: ubuntu-latest

    needs: [build] # VVI NOTE: jobs in github actions run in parallel, but our 'deploy' depends upon 'build'  
    # so we use needs: [] where we can define multiple jobs in [] if current job depends on multiple jobs

    environment:
      name: prod

    env:
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}

    steps:
      - name: Trigger Render deploy , linked to my_fast_api:latest
        run: curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"  



# Continuous Deployment(CD) for aws ec2 instance
  deploy-on-ec2:
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: prod
    concurrency:            # never run two deploys ec2 at once
      group: deploy-ec2
      cancel-in-progress: false
    steps:
      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.EC2_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Deploy to EC2
        env:
          HOST: ${{ vars.EC2_HOST }}
          SSH_USER: ${{ vars.EC2_USER }}
          REPO: ${{ github.repository }}
        run: |
          ssh -i ~/.ssh/deploy_key -o ConnectTimeout=15 -o ServerAliveInterval=30 \
            "$SSH_USER@$HOST" "REPO=$REPO bash -s" <<'EOF'
          set -euo pipefail
          APP_DIR="$HOME/myFastAPI"
          COMPOSE="docker compose -f docker-compose-prod.yml"

          if [ -d "$APP_DIR/.git" ]; then
            cd "$APP_DIR"
            git pull --ff-only origin main
          else
            git clone "https://github.com/$REPO.git" "$APP_DIR"
            cd "$APP_DIR"
          fi

          [ -f app/.env ] || { echo "app/.env is missing on the server"; exit 1; }

          $COMPOSE pull
          $COMPOSE up -d --remove-orphans
          docker image prune -af

          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              echo "App is healthy"; exit 0
            fi
            sleep 4
          done
          echo "App did not become healthy"
          $COMPOSE logs --tail=50 fastapi
          exit 1
          EOF