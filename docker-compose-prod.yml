services:
  fastapi:
    depends_on:
      postgres: #run the postgres container 1st before fastapi container
        condition: service_healthy
    image: bijesh09/my_fast_api
    ports: 
    - "127.0.0.1:8000:8000"
    env_file:
      - ./app/.env #injects host machine's env file vars to container's system path
      #NOTE the current dir of host machine must be the project root dir to work smoothly
    restart: unless-stopped
    
  postgres:
    image: postgres:18.6-alpine
    env_file:
      - ./app/.env
    volumes:
      - postgres-db:/var/lib/postgresql #service level volume that mounts the top level volume to this specified path inside container
    healthcheck: #running postgres container first doesnt define readiness of the container, so we need to check if the container is ready to accept connections
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
volumes:
  postgres-db: #top level volume created in hostmachine for persisting data of postgres container